<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>فیلم‌ها</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0c10;
    --bg-soft: #131419;
    --card: #191a20;
    --card-hover: #212229;
    --gold: #e0a94a;
    --gold-dim: #8a6a34;
    --velvet: #7a2634;
    --text: #f3efe6;
    --text-muted: #8d8b86;
    --border: #26272e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1100px 500px at 20% -10%, rgba(224, 169, 74, 0.08), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(122, 38, 52, 0.10), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: "Vazirmatn", Tahoma, sans-serif;
    padding: 28px 20px 60px;
  }

  header {
    max-width: 720px;
    margin: 0 auto 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: linear-gradient(155deg, var(--gold), var(--gold-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: #14120a;
    font-size: 16px;
    flex-shrink: 0;
  }

  .brand .title-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  h1 {
    font-size: 21px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .btn-texts {
    color: var(--gold);
    text-decoration: none;
    font-size: 14px;
    padding: 6px 14px;
    border: 1px solid var(--gold-dim);
    border-radius: 8px;
    transition: all 0.2s;
  }

  .btn-texts:hover {
    background: rgba(224,169,74,0.1);
  }

  .count {
    font-size: 13px;
    color: var(--text-muted);
  }

  /* ===== بخش کاربری ===== */
  .user-section {
    position: relative;
    display: flex;
    align-items: center;
  }

  .btn-user {
    display: flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    padding: 6px 12px;
    border-radius: 10px;
    transition: background 0.2s;
    font-family: inherit;
    font-size: 14px;
  }

  .btn-user:hover {
    background: rgba(255,255,255,0.05);
  }

  .btn-user svg {
    stroke: var(--text-muted);
  }

  .btn-user span {
    color: var(--text);
  }

  .user-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 180px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    display: none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    z-index: 100;
  }

  .user-dropdown.show {
    display: block;
  }

  .user-dropdown .user-info {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
  }

  .user-dropdown .user-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .user-dropdown .user-avatar svg {
    stroke: var(--text-muted);
  }

  .user-dropdown .user-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }

  .user-dropdown .btn-logout {
    display: flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: none;
    color: #e74c3c;
    cursor: pointer;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    width: 100%;
    transition: background 0.2s;
  }

  .user-dropdown .btn-logout:hover {
    background: rgba(231,76,60,0.1);
  }

  .user-dropdown .btn-logout svg {
    stroke: #e74c3c;
  }

  .search-wrap {
    max-width: 720px;
    margin: 0 auto 22px;
    position: relative;
  }

  .search-wrap svg {
    position: absolute;
    top: 50%;
    right: 16px;
    transform: translateY(-50%);
    opacity: 0.5;
    pointer-events: none;
  }

  #search {
    width: 100%;
    padding: 14px 46px 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  #search::placeholder { color: var(--text-muted); }

  #search:focus {
    border-color: var(--gold-dim);
    background: #16171d;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    gap: 10px;
  }

  li a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  li a:hover {
    background: var(--card-hover);
    border-color: var(--gold-dim);
  }
.poster-thumb {
  width: 50px;
  height: 70px;
  border-radius: 8px;
  flex-shrink: 0;
  overflow: hidden;
  background: linear-gradient(155deg, var(--velvet), #3c1119);
  display: flex;
  align-items: center;
  justify-content: center;
}
  .title { font-size: 16px; font-weight: 600; flex: 1; min-width: 0; }
  .title span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .go {
    color: var(--gold);
    opacity: 0.7;
    flex-shrink: 0;
  }

  .empty, .no-match {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .skeleton {
    height: 60px;
    border-radius: 12px;
    background: linear-gradient(90deg, var(--card) 0%, var(--card-hover) 50%, var(--card) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.3s ease-in-out infinite;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  @media (max-width: 600px) {
    header { flex-direction: column; align-items: stretch; gap: 8px; }
    .brand { justify-content: center; }
    .count { text-align: center; }
    .user-section { align-self: flex-end; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">۲۴</div>
    <div class="title-group">
      <h1>فیلم‌ها</h1>
      
    </div>
  </div>
  <span class="count" id="count"></span>
  <div class="user-section">
    <button class="btn-user" id="userMenuBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span id="usernameDisplay">کاربر</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m6 9 6 6 6-6"/>
      </svg>
    </button>
    <div class="user-dropdown" id="userDropdown">
      <div class="user-info">
        <div class="user-avatar">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div class="user-name" id="dropdownUsername">کاربر</div>
      </div>
      <button class="btn" id="">
        <img src="/assets/text.svg" href="/texts.html" alt="توضیح تصویر" width="200" height="200">
       متن ها
      </button>
      
      <button class="btn-logout" id="logoutBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        خروج
      </button>
    </div>
  </div>
</header>

<div class="search-wrap">
  <input id="search" type="text" placeholder="اسم فیلم رو جستجو کن…" autocomplete="off" />
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
  </svg>
</div>

<main>
  <ul id="list">
    <li><div class="skeleton"></div></li>
    <li><div class="skeleton"></div></li>
    <li><div class="skeleton"></div></li>
  </ul>
</main>

<script>
// ============================================================
// 🔐 بررسی احراز هویت
// ============================================================
const token = localStorage.getItem('accessToken');
const username = localStorage.getItem('username');

if (!token) {
  window.location.href = '/login.html';
}

// نمایش نام کاربری
if (username) {
  document.getElementById('usernameDisplay').textContent = username;
  document.getElementById('dropdownUsername').textContent = username;
}

// ============================================================
// 👤 منوی کاربری
// ============================================================
const userMenuBtn = document.getElementById('userMenuBtn');
const userDropdown = document.getElementById('userDropdown');

userMenuBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  userDropdown.classList.toggle('show');
});

document.addEventListener('click', () => {
  userDropdown.classList.remove('show');
});

// ============================================================
// 🚪 خروج
// ============================================================
document.getElementById('logoutBtn').addEventListener('click', async () => {
  const username = localStorage.getItem('username');
  
  if (username) {
    try {
      await fetch('/api/auth?action=logout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username }),
      });
    } catch (err) {
      console.log('خطا در خروج:', err);
    }
  }

  localStorage.removeItem('accessToken');
  localStorage.removeItem('refreshToken');
  localStorage.removeItem('username');
  window.location.href = '/login.html';
});

// ============================================================
// 📥 دریافت فیلم‌ها
// ============================================================
let allMovies = [];

function render(movies) {
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  count.textContent = allMovies.length ? allMovies.length + ' فیلم' : '';

  if (!allMovies.length) {
    list.innerHTML = '<li class="empty">🎬 هنوز فیلمی اضافه نشده.</li>';
    return;
  }

  if (!movies.length) {
    list.innerHTML = '<li class="no-match">🔍 چیزی با این اسم پیدا نشد.</li>';
    return;
  }

  list.innerHTML = movies
    .map((m) => {
      const displayName = m.name.replace(/-/g, ' ');
      
      return `
        <li>
          <a href="/watch.html?id=${encodeURIComponent(m.name)}">
            <div class="poster-thumb">
              <img 
                src="/api/poster/${encodeURIComponent(m.name)}" 
                alt="${escapeHtml(displayName)}"
                loading="lazy"
                onerror="this.style.display='none';this.parentElement.innerHTML='<span style=\\'font-size:24px;\\'>🎬</span>'"
                style="width:100%;height:100%;object-fit:cover;border-radius:8px;"
              />
            </div>
            <div class="title"><span>${escapeHtml(displayName)}</span></div>
            <svg class="go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
          </a>
        </li>
      `;
    })
    .join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

fetch('/api/movies', {
  headers: { 'Authorization': `Bearer ${token}` }
})
  .then((r) => {
    if (r.status === 401) {
      localStorage.removeItem('token');
      window.location.href = '/login.html';
      return;
    }
    return r.json();
  })
  .then((movies) => {
    allMovies = Array.isArray(movies) ? movies : [];
    render(allMovies);
  })
  .catch(() => {
    document.getElementById('list').innerHTML = '<li class="no-match">خطا در بارگذاری لیست.</li>';
  });

document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  const filtered = q ? allMovies.filter((m) => m.name.toLowerCase().includes(q)) : allMovies;
  render(filtered);
});
</script>

</body>
</html>
