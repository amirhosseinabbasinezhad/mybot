<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>فیلم‌ها</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0c10;
    --bg-soft: #131419;
    --card: #191a20;
    --card-hover: #212229;
    --gold: #e0a94a;
    --gold-dim: #8a6a34;
    --velvet: #7a2634;
    --text: #f3efe6;
    --text-muted: #8d8b86;
    --border: #26272e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1100px 500px at 20% -10%, rgba(224, 169, 74, 0.08), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(122, 38, 52, 0.10), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: "Vazirmatn", Tahoma, sans-serif;
    padding: 28px 20px 60px;
  }

  header {
    max-width: 720px;
    margin: 0 auto 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: linear-gradient(155deg, var(--gold), var(--gold-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: #14120a;
    font-size: 16px;
    flex-shrink: 0;
  }

  .brand .title-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  h1 {
    font-size: 21px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .btn-texts {
    color: var(--gold);
    text-decoration: none;
    font-size: 14px;
    padding: 6px 14px;
    border: 1px solid var(--gold-dim);
    border-radius: 8px;
    transition: all 0.2s;
  }

  .btn-texts:hover {
    background: rgba(224,169,74,0.1);
  }

  .btn-logout {
    color: #e74c3c;
    text-decoration: none;
    font-size: 13px;
    padding: 6px 14px;
    border: 1px solid #e74c3c;
    border-radius: 8px;
    transition: all 0.2s;
    cursor: pointer;
    background: none;
    font-family: inherit;
  }

  .btn-logout:hover {
    background: rgba(231,76,60,0.1);
  }

  .count {
    font-size: 13px;
    color: var(--text-muted);
  }

  .search-wrap {
    max-width: 720px;
    margin: 0 auto 22px;
    position: relative;
  }

  .search-wrap svg {
    position: absolute;
    top: 50%;
    right: 16px;
    transform: translateY(-50%);
    opacity: 0.5;
    pointer-events: none;
  }

  #search {
    width: 100%;
    padding: 14px 46px 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  #search::placeholder { color: var(--text-muted); }

  #search:focus {
    border-color: var(--gold-dim);
    background: #16171d;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    gap: 10px;
  }

  li a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  li a:hover {
    background: var(--card-hover);
    border-color: var(--gold-dim);
  }

  /* ===== پوستر فیلم در لیست ===== */
  .poster-thumb {
    width: 50px;
    height: 70px;
    border-radius: 8px;
    flex-shrink: 0;
    background: linear-gradient(155deg, var(--velvet), #3c1119);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    overflow: hidden;
    object-fit: cover;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .poster-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .poster-thumb .fallback {
    font-size: 24px;
  }

  .title {
    font-size: 16px;
    font-weight: 600;
    flex: 1;
    min-width: 0;
  }
  .title span {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .go {
    color: var(--gold);
    opacity: 0.7;
    flex-shrink: 0;
  }

  .empty, .no-match {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .skeleton {
    height: 70px;
    border-radius: 12px;
    background: linear-gradient(90deg, var(--card) 0%, var(--card-hover) 50%, var(--card) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.3s ease-in-out infinite;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  @media (max-width: 600px) {
    header { flex-direction: column; align-items: stretch; gap: 8px; }
    .brand { justify-content: center; }
    .count { text-align: center; }
    .poster-thumb { width: 40px; height: 56px; font-size: 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    
    <div class="title-group">
      <h1>فیلم‌ها</h1>
      <a href="/texts.html" class="btn-texts">📝 متن‌ها</a>
      <button class="btn-logout" id="logoutBtn">🚪 خروج</button>
    </div>
  </div>
  <span class="count" id="count"></span>
</header>

<div class="search-wrap">
  <input id="search" type="text" placeholder="اسم فیلم رو جستجو کن…" autocomplete="off" />
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
  </svg>
</div>

<main>
  <ul id="list">
    <li><div class="skeleton"></div></li>
    <li><div class="skeleton"></div></li>
    <li><div class="skeleton"></div></li>
  </ul>
</main>

<script>
// ============================================================
// 🔐 مدیریت توکن با Refresh
// ============================================================

async function refreshAccessToken() {
  const refreshToken = localStorage.getItem('refreshToken');
  
  if (!refreshToken) {
    window.location.href = '/login.html';
    return null;
  }

  try {
    const response = await fetch('/api/auth?action=refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refreshToken }),
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || 'خطا در تمدید توکن');
    }

    localStorage.setItem('accessToken', data.accessToken);
    return data.accessToken;

  } catch (err) {
    console.error('❌ خطا در تمدید توکن:', err);
    localStorage.removeItem('accessToken');
    localStorage.removeItem('refreshToken');
    localStorage.removeItem('username');
    window.location.href = '/login.html';
    return null;
  }
}

async function fetchWithAuth(url, options = {}) {
  let accessToken = localStorage.getItem('accessToken');
  
  if (!accessToken) {
    window.location.href = '/login.html';
    return;
  }

  options.headers = {
    ...options.headers,
    'Authorization': `Bearer ${accessToken}`
  };

  let response = await fetch(url, options);

  if (response.status === 401) {
    console.log('🔄 توکن منقضی شده، تمدید میکنم...');
    
    const newToken = await refreshAccessToken();
    if (newToken) {
      options.headers['Authorization'] = `Bearer ${newToken}`;
      response = await fetch(url, options);
    }
  }

  return response;
}

// ============================================================
// 📥 دریافت فیلم‌ها با پوستر
// ============================================================

let allMovies = [];

// ============================================================
// 🖼️ گرفتن پوستر فیلم
// ============================================================
async function getPosterUrl(movieName) {
  try {
    const response = await fetch(`/api/poster/${encodeURIComponent(movieName)}`);
    if (response.ok) {
      return `/api/poster/${encodeURIComponent(movieName)}`;
    }
    return null;
  } catch (err) {
    return null;
  }
}

function render(movies) {
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  count.textContent = allMovies.length ? allMovies.length + ' فیلم' : '';

  if (!allMovies.length) {
    list.innerHTML = '<li class="empty">🎬 هنوز فیلمی اضافه نشده.</li>';
    return;
  }

  if (!movies.length) {
    list.innerHTML = '<li class="no-match">🔍 چیزی با این اسم پیدا نشد.</li>';
    return;
  }

  list.innerHTML = movies
    .map((m) => {
      const displayName = m.name.replace(/-/g, ' ');
      
      // ساخت تگ عکس با fallback
      const posterHtml = `
        <div class="poster-thumb">
          <img 
            src="/api/poster/${encodeURIComponent(m.name)}" 
            alt="${escapeHtml(displayName)}"
            loading="lazy"
            onerror="this.style.display='none';this.parentElement.innerHTML='<span class=\\'fallback\\'>🎬</span>'"
          />
        </div>
      `;

      return `
        <li>
          <a href="/watch.html?id=${encodeURIComponent(m.name)}">
            ${posterHtml}
            <div class="title"><span>${escapeHtml(displayName)}</span></div>
            <svg class="go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
          </a>
        </li>
      `;
    })
    .join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============================================================
// 🚀 بارگذاری اولیه
// ============================================================

const token = localStorage.getItem('accessToken');
if (!token) {
  window.location.href = '/login.html';
}

fetchWithAuth('/api/movies')
  .then((r) => {
    if (!r) return;
    if (r.status === 401) {
      localStorage.removeItem('accessToken');
      localStorage.removeItem('refreshToken');
      window.location.href = '/login.html';
      return;
    }
    return r.json();
  })
  .then((movies) => {
    allMovies = Array.isArray(movies) ? movies : [];
    render(allMovies);
  })
  .catch((err) => {
    console.error('❌ خطا:', err);
    document.getElementById('list').innerHTML = '<li class="no-match">❌ خطا در بارگذاری لیست.</li>';
  });

// ============================================================
// 🔍 جستجو
// ============================================================
document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  const filtered = q ? allMovies.filter((m) => m.name.toLowerCase().includes(q)) : allMovies;
  render(filtered);
});

// ============================================================
// 🚪 خروج
// ============================================================
document.getElementById('logoutBtn').addEventListener('click', async () => {
  const username = localStorage.getItem('username');
  
  if (username) {
    try {
      await fetch('/api/auth?action=logout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username }),
      });
    } catch (err) {
      console.log('خطا در خروج:', err);
    }
  }

  localStorage.removeItem('accessToken');
  localStorage.removeItem('refreshToken');
  localStorage.removeItem('username');
  window.location.href = '/login.html';
});

console.log('🎬 Movies page loaded!');
</script>

</body>
</html>
